<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lezione 1</title>
<style>
:root{--bg:#0a0a0a;--fg:#f3eee6;--gold:#d4b483;--line:#333}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#111;z-index:30}
.brand b{color:var(--gold);font-weight:400}
.controls{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
button{background:transparent;color:var(--fg);border:1px solid #444;padding:7px 10px;cursor:pointer;font:11px/1 Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
button.on{background:var(--gold);color:#111;border-color:var(--gold)}
#counter{font:12px Helvetica,Arial,sans-serif;color:var(--gold)}
.home,.help{position:fixed;inset:0;z-index:40;background:#070707;overflow:auto;padding:28px 7vw 80px}
.home.hide,.help.hide{display:none}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:18px;max-width:980px}
.toc button{text-align:left;padding:14px;text-transform:none;letter-spacing:0;font:15px Helvetica,Arial,sans-serif;background:#141414}
main{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:none;overflow:auto;padding-bottom:48px}
.slide.on{display:block}
.hero{height:62vh;overflow:hidden;background:#1a1a1a}
.hero img{width:100%;height:62vh;object-fit:cover;display:block}
.pad{padding:12px 6vw 0}
.k{font:11px Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h2{font-size:clamp(22px,3.4vw,34px);font-weight:400;margin:0 0 10px}
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 6vw}
.refs img{width:100%;height:160px;object-fit:cover;display:block;background:#1a1a1a}
footer{position:fixed;bottom:0;left:0;right:0;padding:8px 12px;border-top:1px solid var(--line);background:#111;height:36px}
body.en .it{display:none!important}body.en .en{display:block}body:not(.en) .en{display:none!important}body:not(.en) .it{display:block}
#tr,#voice,.sub,#helpBtn,#help,#helpClose{display:none!important}
</style></head>
<body>
<div class="home" id="home">
<h2>Il Sistema Moda</h2>
<p style="margin:18px 0"><button class="on" id="startBtn">Inizia</button></p>
<div class="toc" id="toc"></div>
</div>
<div class="help hide" id="help"><button id="helpClose">x</button></div>
<header>
<div class="brand">FSF · <b>Lezione 1</b></div>
<div class="controls">
<button id="homeBtn">Home</button>
<button id="helpBtn">?</button>
<button id="tr">T</button>
<button id="voice">V</button>
<button id="snd">Suono</button>
<button id="music">Musica</button>
<button id="fs">Full</button>
<span id="timer"></span>
<button id="prev">Prev</button><span id="counter">1</span><button id="next">Next</button>
</div></header>
<div class="sub"><span id="subtxt"></span></div>
<main id="deck"></main>
<footer></footer>
<script src="p0.js"></script>
<script src="p1.js"></script>
<script src="p2.js"></script>
<script src="p3.js"></script>
<script src="p4.js"></script>
<script src="engine.js"></script>
<script src="notes.js"></script>
<script src="extra.js"></script>
<script src="docente.js"></script>
<script src="playvid.js"></script>
</body></html>
